{% extends "base.html" %}
{% block title %}Log in: ProfPulse{% endblock %}

{% block content %}
<section class="page-head narrow">
  <p class="eyebrow">Log in</p>
  <h1>Welcome back</h1>
</section>

<form class="form narrow" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>School email
    <input name="email" type="email" required autocomplete="email" value="{{ email }}">
  </label>
  <label>Password
    <input name="password" type="password" required autocomplete="current-password">
  </label>
  <p class="form-actions">
    <button class="btn" type="submit">Log in</button>
    <a href="{{ url_for('auth.register') }}">Make an account</a>
  </p>
</form>
{% endblock %}
